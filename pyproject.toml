[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "githotmap"
version = "0.1.0"
description = "Git 技术债热力图与优先级排序工具：把 Git 历史元数据转化为风险热力图与重构优先级排序。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CS5351 Team" }]
keywords = ["git", "technical-debt", "heatmap", "software-engineering", "refactoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
# GitPython 是 Git History Analyzer（Member 4）的核心依赖，
# 用于替代 subprocess + 手写解析器的方案，提供结构化的 Commit/File 对象。
dependencies = [
    "GitPython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
githotmap = "githotmap.cli.main:main"

[project.urls]
Homepage = "https://example.invalid/githotmap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
githotmap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
