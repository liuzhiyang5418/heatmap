name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # 部分测试需要完整历史（浅克隆边界与提交计数）。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        # 锁定 ruff / mypy 版本：pyproject.toml 未显式配置 select，
        # 告警集合取决于这两个版本的默认规则集，锁版本门禁才可复现。
        run: python -m pip install -e '.[dev,web]' 'ruff==0.17.5' 'mypy==2.4.1'
      - name: Run unit and system tests with coverage
        # 覆盖率阈值见 [tool.coverage.report] fail_under：按实测值设定
        # （Sprint 2 收口实测 93%，门禁取 90%），作用是只升不降。
        # 性能类用例（marker: slow）单独在下面一个组合上跑，避免 6 个
        # 矩阵组合各自做一遍与机器速度相关的测量。
        run: python -m pytest --cov --cov-report=term-missing -m "not slow"
      - name: Run performance regression guard
        # 与机器无关的相对度量（伸缩性 < 8×、灾难上界 60s），详见
        # tests/test_performance.py 的模块 docstring。
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: python -m pytest -m slow
      # 静态检查固定跑在一个组合上，避免 6 个组合重复执行。
      # 范围是**全仓**（src tests / src），而不是「变更的 NFR 模块」：
      # 增量门禁会让未列入清单的文件悄悄退化。
      - name: Lint whole repository
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: python -m ruff check src tests
      - name: Type-check whole repository
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: python -m mypy src
      - name: Run browser interaction test
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env:
          HEATMAP_CHROME: /usr/bin/google-chrome
        run: python -m pytest tests/test_html_browser.py
